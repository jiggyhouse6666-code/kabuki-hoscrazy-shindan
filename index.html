<title>歌舞伎町ホスト狂い診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root {
  --pink-s: #ffb7d5; --pink: #ff5fa2; --lav: #d8b8ff; --gold: #ffd76a; --gold-d: #c9962f; --pearl: #fff9fd; --plum: #5b276d; --night: #25102f;
  --ink: #3b1850; --ink-2: #7a5290;
  --f: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --fd: 'Dela Gothic One', 'Zen Maru Gothic', sans-serif;
  --tc: 255,95,162;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; }
body { background: var(--night); color: var(--pearl); font-family: var(--f); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
a { color: inherit; }
#root { min-height: 100%; }
.bg { position: fixed; inset: 0; z-index: 0; background:
  radial-gradient(60% 40% at 15% 6%, rgba(255,95,162,.38), transparent 70%),
  radial-gradient(55% 40% at 90% 30%, rgba(216,184,255,.28), transparent 70%),
  radial-gradient(70% 50% at 50% 105%, rgba(255,215,106,.22), transparent 70%),
  linear-gradient(180deg, #3a1649 0%, #25102f 55%, #1b0a24 100%); }
.bg i { position: absolute; width: 8px; height: 8px; background: #fff3b0; transform: rotate(45deg); opacity: .0; animation: tw 4s infinite; border-radius: 1px; box-shadow: 0 0 8px #ffe08a; }
@keyframes tw { 0%,100% { opacity: 0; transform: rotate(45deg) scale(.4); } 50% { opacity: .85; transform: rotate(45deg) scale(1); } }
.app { position: relative; z-index: 1; width: 100%; max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(26px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 16px; flex: 1; animation: rise .5s both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes pop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

/* ボタン */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 58px; padding: 14px 22px; border-radius: 999px; font-weight: 900; font-size: 18px; letter-spacing: .04em; text-decoration: none; text-align: center;
  background: linear-gradient(180deg, #ff9ac6 0%, #ff5fa2 55%, #e9407f 100%); color: #fff; border: 3px solid #ffe08a;
  box-shadow: 0 6px 0 #b82f67, 0 14px 24px -6px rgba(255,95,162,.6), inset 0 2px 0 rgba(255,255,255,.55); text-shadow: 0 1px 0 rgba(120,20,60,.5); transition: transform .12s, box-shadow .12s; }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b82f67, 0 6px 12px -4px rgba(255,95,162,.6), inset 0 2px 0 rgba(255,255,255,.55); }
.btn.sub { background: linear-gradient(180deg, #fffdf7, #ffeec2); color: #7a4c0a; border-color: #e6bb55; box-shadow: 0 5px 0 #c9962f, 0 12px 20px -8px rgba(255,215,106,.5); text-shadow: none; }
.btn.ghost { background: rgba(255,255,255,.08); color: var(--pearl); border: 2px solid rgba(255,255,255,.28); box-shadow: none; min-height: 50px; font-size: 16px; text-shadow: none; }
.btn[disabled] { opacity: .45; filter: grayscale(.4); pointer-events: none; }
.btn.sm { min-height: 46px; font-size: 15px; padding: 10px 16px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* スタート */
.start { align-items: center; text-align: center; gap: 14px; }
.pre-t { margin-top: 4px; font-weight: 900; font-size: 14px; letter-spacing: .3em; color: var(--gold); text-shadow: 0 0 12px rgba(255,215,106,.5); padding-left: .3em; }
.title { font-family: var(--fd); display: flex; flex-direction: column; align-items: center; line-height: 1.12; }
.title .t1 { font-size: clamp(22px, 7vw, 30px); letter-spacing: .24em; padding-left: .24em; color: #fff; }
.title .t2 { font-size: min(62px, calc((100vw - 44px) / 7.6)); white-space: nowrap; letter-spacing: .02em; background: linear-gradient(180deg, #fff6c9 0%, #ffd76a 45%, #f0a63a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #9a5d12) drop-shadow(0 0 16px rgba(255,150,200,.55)); }
.cast { position: relative; width: 100%; max-width: 380px; aspect-ratio: 1 / .8; margin: 4px auto 0; }
.cast .kchar { position: absolute; filter: drop-shadow(0 10px 10px rgba(0,0,0,.35)); animation: bob 3.2s ease-in-out infinite; }
.cast .c0 { left: 1%; top: 10%; width: 36%; animation-delay: -.2s; } .cast .c1 { left: 32%; top: 0%; width: 36%; animation-delay: -1.1s; z-index: 2; } .cast .c2 { right: 1%; top: 10%; width: 36%; animation-delay: -2s; }
.cast .c3 { left: 4%; bottom: 0; width: 32%; animation-delay: -.7s; } .cast .c4 { left: 34%; bottom: -4%; width: 32%; animation-delay: -1.6s; z-index: 2; } .cast .c5 { right: 4%; bottom: 0; width: 32%; animation-delay: -2.4s; }
.main-copy { font-weight: 900; font-size: clamp(22px, 6.6vw, 30px); line-height: 1.35; color: #ffe3f0; text-shadow: 0 0 18px rgba(255,95,162,.7); }
.sub-copy { font-weight: 700; font-size: 16px; color: var(--lav); }

/* 集計: 同じ回答なら必ず同じ結果 */
function kAnalyze(answers) {
  const N = KD.TYPES.length, raw = new Array(N).fill(0), tops = new Array(N).fill(0), late = new Array(N).fill(0);
  let heat = 0;
  const letters = [0, 0, 0, 0];
  answers.forEach(function (a, qi) {
    if (a == null) return;
    const o = KD.QUESTIONS[qi].o[a];
    letters[a] += 1; heat += o.k;
    let best = 0;
    Object.keys(o.s).forEach(function (k) { const v = o.s[k]; raw[k - 1] += v; late[k - 1] += v * (qi + 1); if (v > best) best = v; });
    Object.keys(o.s).forEach(function (k) { if (o.s[k] === best) tops[k - 1] += 1; });
  });
  const idx = raw.map(function (_, i) { return i; });
  idx.sort(function (a, b) { return (raw[b] - raw[a]) || (tops[b] - tops[a]) || (late[b] - late[a]) || (a - b); });
  const total = raw.reduce(function (s, v) { return s + v; }, 0) || 1;
  // ホスト狂い度(エンタメ用): 回答の熱量の合計を 8〜98% に換算
  const maxHeat = KD.QUESTIONS.length * 3;
  const crazy = Math.max(8, Math.min(98, Math.round(8 + (heat / maxHeat) * 90)));
  return { raw: raw, main: idx[0], sub: idx[1], order: idx, share: raw.map(function (v) { return Math.round(v / total * 100); }), crazy: crazy, letters: letters, heat: heat };
}

    h('div', { className: 'card warn', style: delay(4) }, h('h2', null, '気をつけたいポイント'), h('p', null, t.caution)),
    h('div', { className: 'card', style: delay(5) }, h('h2', null, 'あなたの回答の傾向'), h('p', { id: 'tendency' }, tendency(res, t, sub))),
    h('div', { className: 'cta-card', id: 'cta-card' },

    h('div', { className: 'card', style: delay(6) },

      h('button', { className: 'btn sm ghost', id: 'retry-btn', style: { marginTop: 10, background: '#f4e9fb', color: '#5b276d', borderColor: '#dcc4ee' }, onClick: props.onRetry }, 'もう一度診断する')),
    h('p', { className: 'disc' }, 'この診断はエンタメ目的で、医学的な診断ではありません。予算を決めて、無理のない範囲で楽しもう。診断の回答はこの端末のブラウザ内だけで処理され、外部に送信されません。'));
}

function Field(props) {

}
function isUrl(u) { return /^https?:\/\//i.test(u || ''); }

    h('div', { className: 'tmsg', id: 'type-msg' }, h(KCharacter, { k: t.key, mood: 'happy' }), h('p', null, t.shop)),

    h('div', { className: 'card' }, h('h2', null, 'はじめての人へ'), h('ol', { className: 'how' },

    }),

    h('p', { className: 'disc' }, '来店や支出をすすめるものではありません。お酒は20歳になってから。料金や条件は必ず各店舗にご確認ください。個人情報の入力や会員登録は必要ありません。'));
}

function App() {
  const [screen, setScreen] = useState('start');
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState(function () { return new Array(NQ).fill(null); });
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState('');
  const [card, setCard] = useState({});
  const res = kAnalyze(answers);
  const type = KD.TYPES[res.main], sub = KD.TYPES[res.sub];
  const tt = useRef(0);
  useEffect(function () { try { window.scrollTo(0, 0); } catch (e) {} }, [screen, idx]);
  function flash(m) { setToast(m); clearTimeout(tt.current); tt.current = setTimeout(function () { setToast(''); }, 2200); }
  function pick(i) { setAnswers(function (a) { const n = a.slice(); n[idx] = i; return n; }); }
  function next() { if (answers[idx] == null) return; if (idx < NQ - 1) setIdx(idx + 1); else setScreen('reveal'); }
  function back() { if (idx > 0) setIdx(idx - 1); }
  function retry() { setAnswers(new Array(NQ).fill(null)); setIdx(0); setSheet(null); setCard({}); setScreen('start'); }
  function copy() {
    const text = shareText(type);
    const ok = function () { flash('コピーしたよ♡'); };
    const fb = function () { try { const ta = document.getElementById('share-text'); ta.focus(); ta.select(); ta.setSelectionRange(0, 99999); if (document.execCommand('copy')) ok(); else flash('文章を長押ししてコピーしてね'); } catch (e) { flash('文章を長押ししてコピーしてね'); } };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb(); } catch (e) { fb(); }
  }
  function share() {
    const text = shareText(type);
    if (navigator.share) { navigator.share({ text: text }).catch(function (e) { if (!e || e.name !== 'AbortError') setSheet('share'); }); } else setSheet('share');
  }
  function openCard() {
    setSheet('card'); setCard({});
    makeCardImage(type, res).then(function (r) { const f = new File([r.blob], 'host-kurui-shindan.png', { type: 'image/png' }); setCard({ url: r.url, blob: r.blob, canShare: !!(navigator.canShare && navigator.canShare({ files: [f] })) }); }, function () { setCard({ err: true }); });
  }
  function shareImg() { try { const f = new File([card.blob], 'host-kurui-shindan.png', { type: 'image/png' }); navigator.share({ files: [f], text: shareText(type) }).catch(function () {}); } catch (e) {} }
  let body;
  if (screen === 'quiz') body = h(QuizScreen, { idx: idx, answers: answers, onPick: pick, onNext: next, onBack: back });
  else if (screen === 'reveal') body = h(RevealScreen, { type: type, onDone: function () { setScreen('result'); } });
  else if (screen === 'result') body = h(ResultScreen, { type: type, sub: sub, res: res, onShare: share, onCard: openCard, onRetry: retry, onIntro: function () { setScreen('intro'); } });
  else if (screen === 'intro') body = h(IntroScreen, { type: type, onBack: function () { setScreen('result'); } });
  else body = h(StartScreen, { onStart: function () { setIdx(0); setScreen('quiz'); } });
  return h(React.Fragment, null, h(Sparkles), h('main', { className: 'app' }, body),
    sheet === 'share' ? h(ShareSheet, { text: shareText(type), onCopy: copy, onClose: function () { setSheet(null); } }) : null,
    sheet === 'card' ? h(CardSheet, { state: card, onShareImg: shareImg, onClose: function () { setSheet(null); } }) : null,
    toast ? h('div', { className: 'toast', role: 'status' }, toast) : null);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
